<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  <style>
body {
  margin: 0;
  font-family: Poppins, sans-serif;
  background: linear-gradient(135deg, #ff6f00, #ff9f1c);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* MAIN ADMIN BOX */
.admin-container {
  width: 480px;
  padding: 30px;
  border-radius: 20px;
  backdrop-filter: blur(12px);
  background: rgba(255, 255, 255, 0.15);
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
  border: 2px solid rgba(255, 255, 255, 0.4);
  animation: fadeIn 0.8s ease;
  color: white;
  text-align: center;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* TITLE */
.admin-container h2 {
  font-size: 30px;
  margin-bottom: 20px;
  text-shadow: 0 0 10px rgba(255,255,255,0.5);
}

/* INPUTS */
.admin-container input,
.admin-container select {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(255, 255, 255, 0.25);
  color: white;
  font-size: 16px;
  backdrop-filter: blur(5px);
  transition: 0.3s;
}

.admin-container input:focus,
.admin-container select:focus {
  box-shadow: 0 0 12px rgba(255,255,255,0.6);
}

/* BUTTON */
.update-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #00ff88, #00cc66);
  border: none;
  border-radius: 12px;
  color: black;
  font-size: 18px;
  cursor: pointer;
  margin-top: 15px;
  box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
  transition: 0.3s;
}

.update-btn:hover {
  transform: scale(1.03);
  box-shadow: 0 0 25px rgba(0, 255, 136, 1);
}

/* STATUS BOX PREVIEW */
.status-preview {
  margin-top: 20px;
  padding: 12px;
  border-radius: 12px;
  background: rgba(255,255,255,0.2);
  font-size: 18px;
  text-shadow: 0 0 10px rgba(255,255,255,0.4);
}

 </style>
</head>
<body>
    <div class="admin-container"> 

   <input id="orderId" placeholder="Order ID">
<select id="status">
  <option value="received">Order Received</option>
  <option value="preparing">Preparing</option>
  <option value="out_for_delivery">Out for Delivery</option>
  <option value="delivered">Delivered</option>
</select>

<button class="update-btn" onclick="updateStatus()">Update</button>

  <div class="status-preview" id="previewBox">Status: None</div>
</div>
<script>
async function updateStatus() {
  const orderId = document.getElementById("orderId").value;
  const status = document.getElementById("status").value;

  await fetch("http://localhost:5000/api/update-status", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ orderId, status })
  });

  alert("Status Updated");
}
</script>

</body>
</html>
