<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Status Page</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
  margin: 0;
  font-family: Poppins, sans-serif;
  background: linear-gradient(135deg, #ff6f00, #ff9f1c);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.success-container {
  width: 420px;
  padding: 30px;
  border-radius: 20px;
  backdrop-filter: blur(12px);
  background: rgba(255, 255, 255, 0.15);
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
  border: 2px solid rgba(255, 255, 255, 0.4);
  text-align: center;
  color: white;
  animation: fadeIn 0.8s ease;
}

.tick {
  font-size: 70px;
  color: #00ff88;
  text-shadow: 0 0 20px #00ff88;
  animation: pop 0.6s ease;
}

@keyframes pop {
  0% { transform: scale(0); }
  100% { transform: scale(1); }
}

.track-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #00ff88, #00cc66);
  border: none;
  border-radius: 12px;
  color: black;
  font-size: 18px;
  cursor: pointer;
  margin-top: 20px;
  box-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
  transition: 0.3s;
}

.track-btn:hover {
  transform: scale(1.03);
  box-shadow: 0 0 25px rgba(0, 255, 136, 1);
}
a{
    color: black;
    text-decoration: none;
}

  </style>
</head>
<body>
    <div class="success-container">
  <div class="tick">✔</div>

  <h2>Order Placed Successfully!</h2>
  <p>Your delicious food is being prepared.</p>

  <h3>Order ID: <span id="orderId"></span></h3>

  <button class="track-btn"><a href="track.html" onclick="trackOrder()">Track Order</a></button>
</div>

<script src="success.js"></script>
<script>
// Generate random order ID
const id = "ORD" + Math.floor(Math.random() * 900000 + 100000);
document.getElementById("orderId").innerText = id;

// Save ID for tracking page
localStorage.setItem("orderId", id);

function trackOrder() {
  window.location.href = "track.html";
}

</script>
</body>
</html>
