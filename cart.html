<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart Page</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
  margin: 0;
  font-family: Poppins, sans-serif;
  background: linear-gradient(135deg, #ff2a00, #fe5e02);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.cart-container {
  width: 420px;
  padding: 25px;
  border-radius: 20px;
  backdrop-filter: blur(12px);
  background: rgba(255, 255, 255, 0.15);
  box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
  border: 2px solid rgba(255, 255, 255, 0.4);
  animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.cart-container h2 {
  text-align: center;
  color: white;
  font-size: 28px;
  margin-bottom: 20px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  background: rgba(255, 255, 255, 0.2);
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 12px;
  color: white;
  backdrop-filter: blur(5px);
  border: 1px solid rgba(255, 255, 255, 0.3);
}

.cart-item button {
  background: #ff000066;
  border: none;
  padding: 5px 10px;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

.cart-footer {
  margin-top: 20px;
  text-align: center;
  color: white;
}

.checkout-btn {
  width: 100%;
  padding: 12px;
  background: linear-gradient(135deg, #ff3d00, #ff9100);
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 18px;
  cursor: pointer;
  margin-top: 10px;
  box-shadow: 0 0 15px rgba(255, 111, 0, 0.6);
  transition: 0.3s;
}

.checkout-btn:hover {
  transform: scale(1.03);
  box-shadow: 0 0 25px rgba(255, 111, 0, 1);
}
a{
  text-decoration: none;
}
  </style>
</head>
<body>
    <div class="cart-container">
  <h2>🛒Your Cart🛒</h2>

  <div id="cartItems"></div>

  <div class="cart-footer">
    <h3>Total: ₹<span id="totalPrice">0</span></h3>
    <button class="checkout-btn"><a onclick="goToCheckout()">Proceed to Checkout</a></button>
  </div>
</div>
<script>
let cart = JSON.parse(localStorage.getItem("cart")) || {};

function saveCart() {
  localStorage.setItem("cart", JSON.stringify(cart));
}

function renderCart() {
  const box = document.getElementById("cartItems");
  const totalBox = document.getElementById("totalPrice");

  box.innerHTML = "";
  let total = 0;

  Object.entries(cart).forEach(([id, item]) => {
    total += item.price * item.qty;

    box.innerHTML += `
      <div class="cart-item">
        <div>
          <b>${item.name}</b><br>
          ₹${item.price} × ${item.qty}
        </div>
        <div>
          <button onclick="increaseQty('${id}')">+</button>
          <button onclick="decreaseQty('${id}')">-</button>
        </div>
      </div>
    `;
  });

  totalBox.innerText = total;
}

function increaseQty(id) {
  cart[id].qty++;
  saveCart();
  renderCart();
}

function decreaseQty(id) {
  cart[id].qty--;
  if (cart[id].qty <= 0) delete cart[id];
  saveCart();
  renderCart();
}

renderCart();

function Checkout() {
  window.location.href = "checkout.html";
}
function goToCheckout() {
  const total = parseInt(document.getElementById("totalPrice").innerText);

  if (total === 0) {
    alert("Your cart is empty. Add items before proceeding.");
    return;
  }

  window.location.href = "checkout.html";
}


  </script>
</body>
</html>
